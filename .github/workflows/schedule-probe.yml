name: Schedule Probe

# تشخيص فقط: هل جدولة GitHub (schedule) تعمل على هذا المستودع أصلًا؟
# لا يفعل شيئًا سوى طباعة توقيت التشغيل. يُحذف بعد التشخيص.
on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Print marker
        run: echo "cron-alive $(date -u +%FT%TZ)"
