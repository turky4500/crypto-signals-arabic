name: فحص اللوحة ونشرها

# سير عمل واحد يجمع الفحص والنشر معاً.
#
# لماذا دُمج السيرلان السابقان (scanner.yml + pages.yml)؟
#   * الإصدار القديم كان يعمل commit إلى main كل ساعة → نحو 8,760 commit سنوياً،
#     وكل واحد منها يُشغّل نشر Pages من جديد.
#   * الآن لا يُلتزم signals.json إطلاقاً: يُنشَر ضمن artifact مباشرة، فيبقى
#     تاريخ main نظيفاً ويختفي تعارض الدفع بين السيرين.
#   * الحالة السابقة (لعمر الإشارة والإشارات الجديدة) تُقرأ من النسخة المنشورة
#     نفسها عبر SIGNALS_STATE_URL بدل تخزينها في المستودع.

on:
  schedule:
    # الدقيقة الخامسة من كل ساعة، بعد إغلاق شمعة الساعة بخمس دقائق
    - cron: '5 * * * *'
  push:
    branches: [main]
    # تغييرات الكود تُعيد الفحص والنشر فوراً فتبقى البيانات طازجة
  workflow_dispatch:
    inputs:
      as_of:
        description: 'ثبّت المسح على ساعة محددة بصيغة ISO (فارغ = الساعة الحالية)'
        required: false
        default: ''
      top:
        description: 'أقصى عدد إشارات يُنشر'
        required: false
        default: '40'
      min_confirmations:
        description: 'أدنى عدد استراتيجيات متحققة معاً (0 = بلا فلتر)'
        required: false
        default: '0'
      alert_tp_pct:
        description: 'هدف الربح % لتنبيهات واتساب — الافتراضي 3 (انظر docs/alert-gate-study.md)'
        required: false
        default: ''
      alert_sl_pct:
        description: 'وقف الخسارة % لتنبيهات واتساب — الافتراضي 2'
        required: false
        default: ''
      whatsapp_dry_run:
        description: 'اصنع رسائل واتساب دون إرسالها (true للتجربة الآمنة)'
        required: false
        default: 'false'

permissions:
  contents: read
  pages: write
  id-token: write

# منع تراكب دورتين: لو تأخر فحص لا يُلغى بل يُنتظر
concurrency:
  group: scan-and-deploy
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: جلب المستودع
        uses: actions/checkout@v7

      - name: إعداد Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt

      - name: تشغيل الماسح
        env:
          SIGNALS_STATE_URL: ${{ vars.SIGNALS_STATE_URL || 'https://turky4500.github.io/crypto-signals-arabic/signals.json' }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          # تنبيهات واتساب — تُفعَّل تلقائياً متى ضُبطت الأسرار الثلاثة،
          # وتبقى معطّلة بأمان إن نقص أحدها. لا تُطبع قيمها في السجل.
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          set -euo pipefail
          ARGS=(--top "${{ github.event.inputs.top || '40' }}")
          ARGS+=(--min-confirmations "${{ github.event.inputs.min_confirmations || '0' }}")
          AS_OF="${{ github.event.inputs.as_of || '' }}"
          if [ -n "$AS_OF" ]; then ARGS+=(--as-of "$AS_OF"); fi
          TP="${{ github.event.inputs.alert_tp_pct || '' }}"
          SL="${{ github.event.inputs.alert_sl_pct || '' }}"
          if [ -n "$TP" ]; then ARGS+=(--alert-tp-pct "$TP"); fi
          if [ -n "$SL" ]; then ARGS+=(--alert-sl-pct "$SL"); fi
          if [ "${{ github.event.inputs.whatsapp_dry_run || 'false' }}" = "true" ]; then
            ARGS+=(--whatsapp-dry-run --whatsapp-url https://dry-run.invalid --whatsapp-token dry --whatsapp-to 000)
          fi
          # طباعة وجود الأسرار لا قيمها — للتحقق من الضبط دون تسريب
          for V in WHATSAPP_API_URL WHATSAPP_API_TOKEN WHATSAPP_TO; do
            if [ -n "${!V:-}" ]; then echo "  ✓ $V مضبوط"; else echo "  ✗ $V غير مضبوط"; fi
          done
          echo "تشغيل: python scanner.py ${ARGS[*]}"
          python scanner.py "${ARGS[@]}"

      - name: ملخص الدورة
        if: always()
        run: |
          {
            echo "## نتيجة الفحص"
            echo
            if [ -f signals.json ]; then
              python - <<'PY'
          import json
          d = json.load(open("signals.json", encoding="utf-8"))
          s = d.get("stats", {})
          print(f"- **الشمعة المرجعية:** `{d.get('as_of', '—')}` ({d.get('candle_state', '—')})")
          print(f"- **الأزواج المفحوصة:** {d.get('scanned', 0)} / {d.get('candidate_pairs', 0)}")
          print(f"- **إشارات الدخول:** {s.get('total_entries', 0)} (الطبقة الأولى: {s.get('tier1_entries', 0)})")
          print(f"- **تحذيرات الخروج:** {s.get('total_exits', 0)}")
          print(f"- **إشارات جديدة:** {s.get('new_entries', 0)}")
          cfg = d.get("alert_config", {})
          st = d.get("alert_stats", {})
          alog = d.get("alert_log", [])
          print(f"- **تنبيهات واتساب هذه الدورة:** {d.get('alerts_sent_now', 0)}")
          if cfg:
              print(f"- **بوابة التنبيه:** هدف {cfg.get('take_profit_pct')}% / وقف {cfg.get('stop_loss_pct')}% · أدنى نتيجة {cfg.get('min_score')} · تبريد {cfg.get('cooldown_hours')} ساعة · حد {cfg.get('max_per_cycle')} لكل دورة")
          if st:
              print(f"- **الاحتمال التاريخي المقاس:** إصابة الهدف {st.get('hit_rate_pct')}% مقابل نقطة تعادل {st.get('break_even_win_rate_pct')}% (عامل ربح {st.get('profit_factor')} — أقل من 1)")
          if alog:
              print()
              print("| الزوج | آخر إرسال | سعر الدخول | الهدف | الوقف | الحالة |")
              print("|---|---|---|---|---|---|")
              def px(v):
                  # الأسعار الصغيرة جداً تظهر بالصيغة العلمية — نحوّلها لرقم مقروء
                  try:
                      f = float(v)
                  except (TypeError, ValueError):
                      return '—'
                  digits = '.10f' if abs(f) < 0.01 else '.4f'
                  return f"{f:{digits}}".rstrip('0').rstrip('.')

              for a in alog[:10]:
                  ok = '✅' if a.get('delivered') else '⚠️'
                  when = str(a.get('sent_at', ''))[:16].replace('T', ' ')
                  print(f"| {a.get('pair', a.get('symbol'))} | {when} | {px(a.get('entry_price'))} | {px(a.get('take_profit'))} | {px(a.get('stop_loss'))} | {ok} |")
          PY
            else
              echo "لم يُنتَج signals.json — فشل الماسح ولم يُنشر أي تغيير."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: إعداد Pages
        uses: actions/configure-pages@v6

      - name: رفع ملفات الموقع
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: نشر الموقع
        id: deployment
        uses: actions/deploy-pages@v5
