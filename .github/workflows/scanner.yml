name: فحص إشارات Binance

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4
      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: تثبيت المتطلبات
        run: pip install -r requirements.txt
      - name: تشغيل الماسح
        run: python scanner.py
      - name: حفظ signals.json
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signals.json
          git diff --cached --quiet || git commit -m "تحديث إشارات Binance"
          git push
