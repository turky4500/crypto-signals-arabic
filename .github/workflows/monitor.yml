name: Crypto Monitor

on:
  schedule:
    # كل 5 دقائق — يغطي لحظة إغلاق/فتح شمعة 1H (عند الدقيقة 0) ويحسم الأهداف لحظيًا تقريبًا
    # (حديق GitHub الأدنى ~5 دقائق؛ التأخير الفعلي قد يزيد قليلاً عند ذروة الضغط)
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limit_symbols:
        description: 'عدد محدود من العملات للاختبار (اتركه فارغًا لكل الأزواج)'
        type: string
        default: ''
      no_whatsapp:
        description: 'منع إرسال إشعارات WhatsApp'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync to latest main (قاعدة طازجة تمنع الجولات الشبح)
        run: |
          # الجولات تُنفَّذ متسلسلة، لكن checkout يثبّت نسخة لحظة الاستدعاء —
          # فإن تحرك main بعدها (جولة سابقة دفعت متأخرة) أصبح الدفع مرفوضًا
          # والـ rebase متصادمًا حتمًا (نفس ملفات JSON تُكتب كل جولة) فتضيع
          # البيانات بصمت بعد أن تكون الرسائل قد أُرسلت فعلًا (جولة شبح →
          # رسائل مكررة). المزامنة هنا لحظة بدء التنفيذ تضمن قاعدة طازجة
          # ودفع fast-forward ناجحًا دائمًا (كاتب واحد متسلسل).
          git fetch origin main -q
          git reset --hard origin/main -q
          echo "base: $(git rev-parse --short HEAD) $(git log -1 --format=%ad --date=format:'%H:%M:%S')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if already fresh (توفير المواعيد والتغذية)
        id: freshness
        run: |
          LAST=$(python -c "import json;print(json.load(open('data/status.json')).get('last_update') or 0)" 2>/dev/null || echo 0)
          NOW=$(( $(date +%s) * 1000 ))
          DIFF=$(( (NOW - LAST) / 1000 ))
          echo "diff_seconds=$DIFF"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$DIFF" -lt 270 ]; then
            echo "STILL_FRESH=true" >> "$GITHUB_OUTPUT"
          else
            echo "STILL_FRESH=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run monitor
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        env:
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_RECEIVER: ${{ secrets.WHATSAPP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          LIMIT_SYMBOLS: ${{ inputs.limit_symbols }}
          NO_WHATSAPP: ${{ inputs.no_whatsapp }}
          RUN_ID: ${{ github.run_number }}
        run: python -m src.main

      - name: Commit data updates
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        run: |
          git config user.name "crypto-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          # الدفع الآمن: نلتزم تغييراتنا (data فقط) ثم ندفع، وإن سبقنا أحد (دفعة
          # خارجية أو دورة أخرى) نُعيد تطبيق التزامنا عبر pull --rebase بدلًا من
          # reset --soft — حتى لا نُرجع أبدًا src/ أو بيانات غيّرها غيرنا.
          # مهم: الفشل هنا يُفشل الجولة صراحةً (exit 1) — فلا ضياع صامت للبيانات
          # بعد إرسال الرسائل (الجولات الشبح كانت تنجح ظاهريًا وتسبب التكرار).
          git add data/
          git diff --cached --quiet && { echo "no data changes"; exit 0; }
          git commit -q -m "chore(data): تحديث بيانات المراقبة والإشارات" || true
          PUSHED=false
          for i in 1 2 3; do
            if git push origin HEAD:main -q; then echo "data committed"; PUSHED=true; break; fi
            echo "push race — pull --rebase ثم إعادة المحاولة ($i)"
            git fetch origin main -q
            if ! git pull --rebase origin main -q; then
              git rebase --abort 2>/dev/null || true
              sleep 5
            fi
          done
          if [ "$PUSHED" != "true" ]; then
            echo "::error::فشل دفع بيانات data/ بعد 3 محاولات — البيانات غير محفوظة!"
            exit 1
          fi

      - name: Assemble static site (web + data)
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        run: |
          # 1) تعقيم: لا تُنشر أبدًا ملفات JSON تالفة (حتى لو ملوثة بعلامات صراع git)
          #    معدَّل أمان: يعزل النشر تمامًا عن أي حالة git داخل مجلد العمل.
          python - <<'PY'
          import glob, json, os, re
          MARK = re.compile(r'^(<{7}|={7,}|>{7})( |$)', re.M)
          for p in glob.glob('data/*.json'):
              path = p.replace('\\', '/')
              try:
                  raw = open(p, encoding='utf-8').read()
              except OSError as exc:
                  print('[sanitize] SKIP unreadable', p, exc)
                  continue
              if MARK.search(raw):
                  print('[sanitize] FIX conflict markers ->', os.path.basename(p))
                  # حدد أي جزء من الملف ملوث: نعيد بناء بأمان لأقرب JSON صالح إن أمكن
                  try:
                      json.loads(raw)
                  except Exception:
                      # إزالة أسطر العلامات فقط؛ الربط الخلفي تتم معالجته هنا بالقاعدة:
                      lines = [ln for ln in raw.splitlines() if not MARK.match(ln)]
                      raw = '\n'.join(lines)
              try:
                  json.loads(raw)
              except Exception as exc:
                  print('[sanitize] DROP corrupt', os.path.basename(p), str(exc)[:80])
                  os.remove(p)
              else:
                  with open(p, 'w', encoding='utf-8') as fh:
                      fh.write(raw)
          PY
          # 2) تجميع الموقع من مجلد العمل (بيانات طازجة + واجهة)
          mkdir -p _site
          cp -r web/* _site/
          mkdir -p _site/data
          if [ -d data ]; then cp -r data/* _site/data/; fi

      - name: Upload Pages artifact
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        id: deployment
        uses: actions/deploy-pages@v4