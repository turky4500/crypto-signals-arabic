name: Crypto Monitor

on:
  schedule:
    # كل ساعة عند الدقيقة 3 (بعد إغلاق شمعة 1H بـ 3 دقائق لضمان ثبات البيانات)
    - cron: '3 * * * *'
  workflow_dispatch:
    inputs:
      limit_symbols:
        description: 'عدد محدود من العملات للاختبار (اتركه فارغًا لكل الأزواج)'
        type: string
        default: ''
      no_whatsapp:
        description: 'منع إرسال إشعارات WhatsApp'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_RECEIVER: ${{ secrets.WHATSAPP_RECEIVER }}
          LIMIT_SYMBOLS: ${{ inputs.limit_symbols }}
          NO_WHATSAPP: ${{ inputs.no_whatsapp }}
          RUN_ID: ${{ github.run_number }}
        run: python -m src.main

      - name: Commit data updates
        run: |
          git config user.name "crypto-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "chore(data): تحديث بيانات المراقبة والإشارات"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main