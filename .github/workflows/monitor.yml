name: Crypto Monitor

on:
  schedule:
    # كل 5 دقائق — يغطي لحظة إغلاق/فتح شمعة 1H (عند الدقيقة 0) ويحسم الأهداف لحظيًا تقريبًا
    # (حديق GitHub الأدنى ~5 دقائق؛ التأخير الفعلي قد يزيد قليلاً عند ذروة الضغط)
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limit_symbols:
        description: 'عدد محدود من العملات للاختبار (اتركه فارغًا لكل الأزواج)'
        type: string
        default: ''
      no_whatsapp:
        description: 'منع إرسال إشعارات WhatsApp'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if already fresh (توفير المواعيد والتغذية)
        id: freshness
        run: |
          LAST=$(python -c "import json;print(json.load(open('data/status.json')).get('last_update') or 0)" 2>/dev/null || echo 0)
          NOW=$(( $(date +%s) * 1000 ))
          DIFF=$(( (NOW - LAST) / 1000 ))
          echo "diff_seconds=$DIFF"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$DIFF" -lt 270 ]; then
            echo "STILL_FRESH=true"
          else
            echo "STILL_FRESH=false"
          fi

      - name: Run monitor
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        env:
          WHATSAPP_API_URL: ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_RECEIVER: ${{ secrets.WHATSAPP_TO }}
          LIMIT_SYMBOLS: ${{ inputs.limit_symbols }}
          NO_WHATSAPP: ${{ inputs.no_whatsapp }}
          RUN_ID: ${{ github.run_number }}
        run: python -m src.main

      - name: Commit data updates
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        run: |
          git config user.name "crypto-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "no data changes" || git commit -m "chore(data): تحديث بيانات المراقبة والإشارات"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main

      - name: Assemble static site (web + data)
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        run: |
          mkdir -p _site
          cp -r web/* _site/
          mkdir -p _site/data
          if [ -d data ]; then cp -r data/* _site/data/; fi

      - name: Upload Pages artifact
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.freshness.outputs.STILL_FRESH != 'true'
        id: deployment
        uses: actions/deploy-pages@v4