<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الصفحة غير موجودة | نبض السوق</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b15'/%3E%3Cpath d='M6 21l5-7 4 4 5-9 6 12' fill='none' stroke='%23ff7a8a' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#070b15;--text:#edf3ff;--muted:#8fa3c4;--dim:#5d708f;--line:#1b2940;--mint:#26e3a2;--red:#ff7a8a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;line-height:1.7;padding:24px;
  background-image:radial-gradient(circle at 12% 0%,rgba(255,122,138,.09),transparent 32%),
                   radial-gradient(circle at 88% 100%,rgba(109,140,255,.1),transparent 30%)}
.card{max-width:560px;text-align:center;padding:44px 32px;border-radius:26px;
  background:linear-gradient(180deg,rgba(18,26,43,.9),rgba(14,20,34,.86));
  border:1px solid rgba(115,145,196,.16);box-shadow:0 22px 60px rgba(0,0,0,.35)}
.code{font-size:74px;font-weight:800;letter-spacing:-.04em;line-height:1;
  background:linear-gradient(120deg,var(--red),#6d8cff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:14px 0 8px;font-size:21px}
p{margin:0 0 26px;color:var(--muted);font-size:14px}
a.btn{display:inline-block;padding:12px 26px;border-radius:12px;background:var(--mint);color:#07110f;
  font-weight:800;font-size:14px;text-decoration:none;transition:.16s}
a.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
a.alt{display:block;margin-top:18px;color:var(--dim);font-size:12.5px;text-decoration:none}
a.alt:hover{color:var(--mint)}
svg{width:74px;height:74px;margin-bottom:6px;opacity:.9}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="card">
  <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M6 42l11-15 8 8 11-19 12 26" stroke="#ff7a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="42" r="4.5" fill="#ff7a8a"/>
    <path d="M8 54h48" stroke="#1b2940" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="code">404</div>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>الرابط الذي فتحته غير صالح أو نُقل إلى مكان آخر. اللوحة الرئيسية ما زالت تعمل.</p>
  <a class="btn" href="./">العودة إلى اللوحة</a>
  <a class="alt" href="https://github.com/turky4500/crypto-signals-arabic" rel="noopener">أو تصفّح المستودع على GitHub ↗</a>
</main>
<script>
  // إن كان المسار مجرد امتداد خاطئ، أعد التوجيه إلى الجذر
  if (location.pathname !== "/" && !/\.(html|json|md|png|svg|ico|txt)$/i.test(location.pathname)) {
    setTimeout(function () { location.replace("./"); }, 3000);
  }
</script>
</body>
</html>
