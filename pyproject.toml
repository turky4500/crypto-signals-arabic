[project]
name = "crypto-signals-arabic"
version = "2.0.0"
description = "منصة مراقبة إشارات البيع والشراء للعملات الرقمية (Spot / USDT / 1H) مع إشعارات WhatsApp"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"